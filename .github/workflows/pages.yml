# Publishes the site at site/ to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same target `make site` serves locally, so what deploys is what was
      # previewed: the page plus the packages it imports, side by side.
      - name: Assemble
        run: make site-build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .site
      - id: deploy
        uses: actions/deploy-pages@v5
